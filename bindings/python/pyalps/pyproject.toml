[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pyalps"
version = "2.3.4b1"
description = "Python Applications and Libraries for Physics Simulations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/pyalps"]
wheel.force-include = { "LICENSE.txt" = "${SKBUILD_METADATA_DIR}/licenses/LICENSE.txt" }
# pyalps_config.py is generated by CMake from this template; the template
# itself does not belong in the wheel.
wheel.exclude = ["pyalps/pyalps_config.py.in"]
build.verbose = true

[tool.scikit-build.cmake.define]
ALPS_DIR = { env = "ALPS_DIR" }

# Application bindings compile selected legacy application sources, and the
# package bundles the ALPS XML/XSL library. Preserve both when this subproject
# is distributed independently of the repository checkout so wheels can also
# be rebuilt from the sdist.
[tool.scikit-build.sdist.force-include]
"../../../LICENSE.txt" = "LICENSE.txt"
"../../../applications/dmft/qmc" = "_vendor/applications/dmft/qmc"
"../../../applications/qmc/dwa" = "_vendor/applications/qmc/dwa"
"../../../tool" = "_vendor/tool"
"../../../lib/xml" = "_vendor/lib/xml"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest"]
test-command = "pytest -q {project}/test/pyalps"

# The ALPS C++ SDK is built once per platform in before-all via the wheel-deps
# CMake preset; ALPS_DIR points every wheel build at that install. The ccache
# in _build/ccache spans the SDK and all wheel builds (cached across CI runs).
[tool.cibuildwheel.environment]
ALPS_DIR = "$(pwd)/_build/wheel-deps/install/share/alps"
CCACHE_DIR = "$(pwd)/_build/ccache"
CCACHE_NAMESPACE = "pyalps-wheel"
CMAKE_ARGS = "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"

# manylinux (AlmaLinux/glibc) uses dnf and glibc's SunRPC/XDR + execinfo.
# musllinux (Alpine/musl) has neither: install libtirpc for the system
# XDR path (ALPS_HAVE_RPC_XDR_H) and disable the execinfo backtrace.
[tool.cibuildwheel.linux]
before-all = [
  "if command -v dnf >/dev/null 2>&1; then dnf install -y ccache cmake hdf5-devel lapack-devel ninja-build; EXTRA=; else apk add --no-cache ccache ninja-is-really-ninja hdf5-dev lapack-dev libtirpc-dev; ln -sf /usr/include/tirpc/rpc /usr/include/rpc; ln -sf /usr/include/tirpc/netconfig.h /usr/include/netconfig.h; export CXXFLAGS=-DALPS_NGS_NO_STACKTRACE; EXTRA='-DALPS_HAVE_RPC_XDR_H=1 -DCMAKE_CXX_STANDARD_LIBRARIES=-ltirpc'; fi",
  "cd {project}",
  "cmake --preset wheel-deps -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $EXTRA",
  "cmake --build --preset wheel-deps -j2",
]
repair-wheel-command = [
  "auditwheel repair -w {dest_dir} {wheel}",
  "auditwheel show {dest_dir}/*.whl",
]

[tool.cibuildwheel.macos]
before-all = [
  "brew install ccache cmake hdf5 ninja",
  "cd {project}",
  "cmake --preset wheel-deps -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DHDF5_ROOT=$(brew --prefix hdf5)",
  "cmake --build --preset wheel-deps -j2",
]
repair-wheel-command = [
  "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
  "delocate-listdeps --all {dest_dir}/*.whl",
]

[[tool.cibuildwheel.overrides]]
select = "*-macosx_*"
inherit.environment = "append"
environment = { CXXFLAGS = "-stdlib=libc++" }
