[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pyalps"
version = "2.3.4b1"
description = "Python Applications and Libraries for Physics Simulations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/pyalps"]
wheel.force-include = { "LICENSE.txt" = "${SKBUILD_METADATA_DIR}/licenses/LICENSE.txt" }
# pyalps_config.py is generated by CMake from this template; the template
# itself does not belong in the wheel.
wheel.exclude = ["pyalps/pyalps_config.py.in"]
build.verbose = true

[tool.scikit-build.cmake.define]
ALPS_DIR = { env = "ALPS_DIR" }

# Application bindings compile selected legacy application sources, and the
# package bundles the ALPS XML/XSL library. Preserve both when this subproject
# is distributed independently of the repository checkout so wheels can also
# be rebuilt from the sdist.
[tool.scikit-build.sdist.force-include]
"../../../LICENSE.txt" = "LICENSE.txt"
"../../../applications/dmft/qmc" = "_vendor/applications/dmft/qmc"
"../../../applications/qmc/dwa" = "_vendor/applications/qmc/dwa"
"../../../tool" = "_vendor/tool"
"../../../lib/xml" = "_vendor/lib/xml"

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
