name: Contribution filing

# Runs when a merged PR lands a submission on the branch. Re-judges it, and only
# if it still meets the threshold, moves it into
# contributions/verified/<name>_<PR author>/ together with results.md, then
# empties contributions/submission/. A resubmission by the same author replaces
# their own folder; nobody else's run can produce that folder name.
on:
  push:
    branches:
      - master
      - ci/algorithm-onboarding
    paths:
      - 'contributions/submission/**'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contributions-file-${{ github.ref }}
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for a submission
        id: scope
        run: |
          if find contributions/submission -maxdepth 1 -type f ! -name .gitkeep | grep -q .; then
            echo "has_submission=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_submission=false" >> "$GITHUB_OUTPUT"
            echo "contributions/submission/ is empty; nothing to file."
          fi

      - name: Find the merged PR and its author
        if: steps.scope.outputs.has_submission == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                 --jq '[.[] | select(.merged_at != null)][0] | "\(.number) \(.user.login)"')
          if [ -z "$pr" ] || [ "$pr" = "null null" ]; then
            echo "::error::Commit ${{ github.sha }} did not come from a merged pull request; submissions must arrive through a PR. Nothing filed."
            exit 1
          fi
          read -r number author <<< "$pr"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "Submission from PR #$number by @$author."

      - name: Judge submission
        if: steps.scope.outputs.has_submission == 'true'
        run: bash contributions/harness/judge.sh "$RUNNER_TEMP/judge"

      - name: File into contributions/verified/
        if: steps.scope.outputs.has_submission == 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          name=$(cat "$RUNNER_TEMP/judge/name")
          dest="contributions/verified/${name}_${AUTHOR}"

          # Same name and author: this replaces the author's own earlier version.
          git rm -r -q --ignore-unmatch "$dest"
          rm -rf "$dest"
          mkdir -p "$dest"
          find contributions/submission -maxdepth 1 -type f ! -name .gitkeep -exec cp {} "$dest"/ \;
          # Keep the wrapper the harness generated from the contract, so the
          # code can be re-judged later. (contract: custom ships its own.)
          [ -f "$dest/algorithm.hpp" ] || cp "$RUNNER_TEMP/judge/generated/algorithm.hpp" "$dest/"

          {
            echo "# ${name} by @${AUTHOR}"
            echo
            echo "Accepted from PR #${NUMBER} (commit ${GITHUB_SHA::12}) on $(date -u +%Y-%m-%d)."
            echo "Threshold: 50% of judged cases. Times are from the filing run."
            echo
            cat "$RUNNER_TEMP/judge/report.md"
          } > "$dest/results.md"

          find contributions/submission -maxdepth 1 -type f ! -name .gitkeep -exec git rm -q {} \;
          git add "$dest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "File ${name} by @${AUTHOR} from PR #${NUMBER} into contributions/verified"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

          { echo "## Filed ${dest}"; echo; cat "$dest/results.md"; } >> "$GITHUB_STEP_SUMMARY"
