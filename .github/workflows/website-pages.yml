name: Website pages

# Lists the pages of the ALPS website that describe the code a PR changes, in
# the job summary, and checks that every source pattern in
# .github/website-pages.json still matches a file (.github/scripts/website_pages.py).
# The listing never fails a PR; a stale pattern does. The website checks that
# the pages named in the map exist.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the page map
        run: python3 .github/scripts/website_pages.py --check
      - name: List the website pages to check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/website_pages.py --base "$BASE" --head HEAD
