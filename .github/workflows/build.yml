name: ALPS source CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CTEST_PARALLEL_LEVEL: 2
  PIP_ONLY_BINARY: ':all:'

jobs:
  prepare:
    name: Validate CI helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Lint workflows and shell helpers
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck .github/scripts/*.sh
      - name: Test CI helpers
        run: |
          python -m pip install pytest
          python -m pytest tests/ci -q --junitxml=ci-tests.xml
      - name: Summarize helper tests
        if: always()
        run: python .github/scripts/junit_summary.py ci-tests.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ci-helper-tests
          path: ci-tests.xml

  build:
    name: Source / ${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"id": "ubuntu-2204-gcc-12-boost91-py314-cxx17", "os": "ubuntu-22.04", "cc": "gcc-12", "cxx": "g++-12", "packages": "gcc-12 g++-12", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.91.0", "python": "3.14", "standard": 17, "extras": true}
          - {"id": "ubuntu-2204-clang-15-boost91-py314-cxx17", "os": "ubuntu-22.04", "cc": "clang-15", "cxx": "clang++-15", "packages": "clang-15", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-clang-18-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "clang-18", "cxx": "clang++-18", "packages": "clang-18", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2204-gcc-11-boost91-py314-cxx17", "os": "ubuntu-22.04", "cc": "gcc-11", "cxx": "g++-11", "packages": "gcc-11 g++-11", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-13-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-13", "cxx": "g++-13", "packages": "gcc-13 g++-13", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-15-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-15", "cxx": "g++-15", "packages": "gcc-15 g++-15", "boost": "1.91.0", "python": "3.14", "standard": 17, "repository": "gcc"}
          - {"id": "ubuntu-2204-clang-14-boost91-py314-cxx17", "os": "ubuntu-22.04", "cc": "clang-14", "cxx": "clang++-14", "packages": "clang-14", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-clang-16-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "clang-16", "cxx": "clang++-16", "packages": "clang-16", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-clang-17-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "clang-17", "cxx": "clang++-17", "packages": "clang-17", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-clang-19-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "clang-19", "cxx": "clang++-19", "packages": "clang-19", "boost": "1.91.0", "python": "3.14", "standard": 17, "repository": "llvm"}
          - {"id": "ubuntu-2404-clang-20-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "clang-20", "cxx": "clang++-20", "packages": "clang-20", "boost": "1.91.0", "python": "3.14", "standard": 17, "repository": "llvm"}
          - {"id": "ubuntu-2404-clang-21-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "clang-21", "cxx": "clang++-21", "packages": "clang-21", "boost": "1.91.0", "python": "3.14", "standard": 17, "repository": "llvm"}
          - {"id": "ubuntu-2404-clang-22-boost91-py314-cxx17", "os": "ubuntu-24.04", "cc": "clang-22", "cxx": "clang++-22", "packages": "clang-22", "boost": "1.91.0", "python": "3.14", "standard": 17, "repository": "llvm"}
          - {"id": "ubuntu-2404-gcc-14-boost76-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.76.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost81-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.81.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost86-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.86.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost87-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.87.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost88-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.88.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost89-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.89.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost90-py314-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.90.0", "python": "3.14", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost91-py311-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.91.0", "python": "3.11", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost91-py312-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.91.0", "python": "3.12", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost91-py313-cxx17", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.91.0", "python": "3.13", "standard": 17}
          - {"id": "ubuntu-2404-gcc-14-boost91-py314-cxx20", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.91.0", "python": "3.14", "standard": 20, "extensive": true}
          - {"id": "ubuntu-2404-gcc-14-boost91-py314-cxx23", "os": "ubuntu-24.04", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc-14 g++-14", "boost": "1.91.0", "python": "3.14", "standard": 23}
          - {"id": "macos-14-clang-boost91-py314-cxx17", "os": "macos-14", "cc": "/usr/bin/clang", "cxx": "/usr/bin/clang++", "packages": "", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "macos-15-clang-boost91-py314-cxx17", "os": "macos-15", "cc": "/usr/bin/clang", "cxx": "/usr/bin/clang++", "packages": "", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "macos-15-intel-clang-boost91-py314-cxx17", "os": "macos-15-intel", "cc": "/usr/bin/clang", "cxx": "/usr/bin/clang++", "packages": "", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "macos-26-clang-boost91-py314-cxx17", "os": "macos-26", "cc": "/usr/bin/clang", "cxx": "/usr/bin/clang++", "packages": "", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "macos-15-gcc-13-boost91-py314-cxx17", "os": "macos-15", "cc": "gcc-13", "cxx": "g++-13", "packages": "gcc@13", "boost": "1.91.0", "python": "3.14", "standard": 17}
          - {"id": "macos-15-gcc-14-boost91-py314-cxx17", "os": "macos-15", "cc": "gcc-14", "cxx": "g++-14", "packages": "gcc@14", "boost": "1.91.0", "python": "3.14", "standard": 17}
    env:
      # Keep the small macOS runners and memory-heavy jobs at two compilers.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ (startsWith(matrix.os, 'macos-') || matrix.extensive) && '2' || '4' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/_build/ccache
      CCACHE_MAXSIZE: 1G
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ALPS_BOOST_MPI: 'ON'
      DEPENDENCY: boost-${{ matrix.boost }}
      BOOST_VERSION: ${{ matrix.boost }}
      COMPILER_PACKAGES: ${{ matrix.packages }}
      COMPILER_REPOSITORY: ${{ matrix.repository }}
      EXTRAS: ${{ matrix.extras }}
      EXTENSIVE: ${{ matrix.extensive }}
      CXX_STANDARD: ${{ matrix.standard }}
      # Exercise the new CMake minimum on the oldest supported compiler.
      CMAKE_REQUIREMENT: ${{ matrix.cc == 'gcc-11' && 'cmake==3.27.9' || 'cmake>=3.27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install CMake and test tools
        run: python -m pip install "$CMAKE_REQUIREMENT" ninja pytest numpy h5py
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          if [[ "$COMPILER_REPOSITORY" == gcc ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          elif [[ "$COMPILER_REPOSITORY" == llvm ]]; then
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
              https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
            sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
            llvm_version="${CC#clang-}"
            echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-$llvm_version main" \
              | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          fi
          sudo apt-get update
          read -r -a compiler_packages <<< "$COMPILER_PACKAGES"
          sudo apt-get install -y ccache liblapack-dev libblas-dev libopenmpi-dev libhdf5-dev \
            libbz2-dev zlib1g-dev liblzma-dev libzstd-dev "${compiler_packages[@]}"
          if [[ "$EXTRAS" == true ]]; then sudo apt-get install -y gfortran xsltproc; fi
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        timeout-minutes: 30
        run: |
          brew install --force-bottle ccache open-mpi hdf5 zstd xz
          if [[ -n "$COMPILER_PACKAGES" ]]; then
            brew install "$COMPILER_PACKAGES"
          fi
      - name: Identify Boost toolchain
        id: toolchain
        run: |
          {
            echo "$ImageVersion"
            "$CXX" --version
            if [[ "$ALPS_BOOST_MPI" == ON ]]; then mpicxx --showme:version; mpicxx --showme; fi
          } > "$RUNNER_TEMP/boost-toolchain"
          hash=$(ccache --hash-file "$RUNNER_TEMP/boost-toolchain")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          python - <<'PYTHON'
          import json, os
          checksums = json.load(open('.github/dependencies.json'))['boost']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('boost_sha256=' + checksums[os.environ['BOOST_VERSION']], file=output)
          PYTHON
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/ccache
          key: ccache-source-${{ matrix.id }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**', 'third_party/**', 'tests/**', 'python/pyalps/**', '.github/dependencies.json', '.github/scripts/build-boost.sh', '.github/scripts/prepare_dependencies.py') }}
          restore-keys: ccache-source-${{ matrix.id }}-
      - name: Reset compiler cache counters
        run: ccache --zero-stats
      - name: Restore pinned Boost build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/boost-install
          # Boost always uses C++17 and has no Python dependency.
          key: boost-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.cxx }}-${{ env.ALPS_BOOST_MPI }}-${{ steps.toolchain.outputs.boost_sha256 }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('.github/scripts/build-boost.sh', '.github/scripts/prepare_dependencies.py') }}
      - name: Prepare pinned Boost
        timeout-minutes: 30
        run: python .github/scripts/prepare_dependencies.py "$DEPENDENCY" _build/boost-install
      - name: Configure SDK
        run: |
          extra_args=()
          if [[ "$EXTRAS" == true ]]; then
            extra_args+=(-DALPS_ENABLE_OPENMP=ON)
          fi
          if [[ "$EXTENSIVE" == true ]]; then extra_args+=(-DALPS_BUILD_EXTENSIVE_TESTS=ON); fi
          cmake -S . -B _build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DALPS_BUILD_TESTING=ON \
            "-DALPS_ENABLE_MPI=$ALPS_BOOST_MPI" \
            "-DCMAKE_PREFIX_PATH=$PWD/_build/boost-install" \
            "-DCMAKE_INSTALL_PREFIX=$PWD/_build/ci/install" \
            "-DCMAKE_CXX_STANDARD=$CXX_STANDARD" "${extra_args[@]}"
      - name: Build SDK
        run: cmake --build _build/ci
      - name: Test SDK
        run: ctest --test-dir _build/ci --output-on-failure --output-junit ctest.xml --no-tests=error
      - name: Test bindings against the installed SDK
        env:
          ALPS_DIR: ${{ github.workspace }}/_build/ci/install/share/alps
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/_build/boost-install
          CMAKE_GENERATOR: Ninja
          PYALPS_TEST_DOWNSTREAM_EXPORT: '1'
        run: |
          cmake --install _build/ci
          python -m pip install build 'nanobind==2.15.0' 'scikit-build-core>=1.0' numpy scipy matplotlib lxml h5py
          if [[ "$RUNNER_OS" == Linux ]]; then python -m pip install patchelf; fi
          python -m pip install --no-build-isolation --no-deps -e python/pyalps \
            --config-settings "build-dir=$PWD/_build/ci-python"
          python .github/scripts/run_with_timeout.py 900 \
            python -m pytest tests/pyalps -q --junitxml=_build/ci/python.xml
      - name: Test installed XML tools after relocation
        if: matrix.extras
        env:
          ALPS_XML_BUILD: _build/ci
        run: python -m pytest tests/cli -q --junitxml=_build/ci/cli.xml
      - name: Build installed C, C++ and Fortran tutorials
        if: matrix.extras
        run: |
          cmake --install _build/ci
          cmake --install _build/ci --component tutorials
          tutorials="$PWD/_build/ci/install/share/alps/tutorials"
          for source in "$tutorials/00-examples" "$tutorials/00-examples/fortran"; do
            output="_build/consumers/${source#"$tutorials/"}"
            cmake -S "$source" -B "$output" -G Ninja \
              "-DALPS_DIR=$PWD/_build/ci/install/share/alps" \
              "-DCMAKE_PREFIX_PATH=$PWD/_build/boost-install"
            cmake --build "$output"
            ctest --test-dir "$output" --output-on-failure --output-junit ctest.xml --no-tests=error
          done
          find "$tutorials" -mindepth 1 -path "$tutorials/00-examples" -prune -o -name CMakeLists.txt -print0 | while IFS= read -r -d '' file; do
            source="${file%/CMakeLists.txt}"
            # The root file installs tutorials; it is not a tutorial project.
            if [[ "$source" == "$tutorials" ]]; then continue; fi
            output="_build/consumers/${source#"$tutorials/"}"
            cmake -S "$source" -B "$output" -G Ninja \
              "-DALPS_DIR=$PWD/_build/ci/install/share/alps" \
              "-DCMAKE_PREFIX_PATH=$PWD/_build/boost-install"
            cmake --build "$output"
            ctest --test-dir "$output" --output-on-failure --output-junit ctest.xml
          done
      - name: Show compiler cache statistics
        if: always()
        continue-on-error: true
        run: ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Summarize test results
        if: always()
        run: python .github/scripts/junit_summary.py '_build/**/ctest.xml' _build/ci/cli.xml _build/ci/python.xml
      - name: Retain test and configure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-${{ matrix.id }}-reports
          path: |
            _build/**/ctest.xml
            _build/ci/cli.xml
            _build/ci/python.xml
            _build/**/Testing/Temporary/**
            _build/**/CMakeFiles/CMakeConfigureLog.yaml

  developer-setup:
    name: Contributor commands / ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_GENERATOR: Ninja
      ALPS_DIR: ${{ github.workspace }}/_build/default/install/share/alps
      PYALPS_TEST_DOWNSTREAM_EXPORT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install Ubuntu native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-all-dev libhdf5-dev libblas-dev liblapack-dev
      - name: Install macOS native prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install --force-bottle boost hdf5 openblas
          echo "CMAKE_PREFIX_PATH=$(brew --prefix boost):$(brew --prefix hdf5):$(brew --prefix openblas)" >> "$GITHUB_ENV"
      - name: Install Python build and test prerequisites
        run: |
          python -m pip install 'cmake>=3.27' ninja 'scikit-build-core>=1.0' 'nanobind==2.15.0' build pytest numpy h5py
          if [[ "$RUNNER_OS" == Linux ]]; then python -m pip install 'patchelf>=0.14'; fi
      - name: Build, test and install with CMake
        run: |
          cmake --preset default
          cmake --build --preset default --parallel 2
          ctest --preset default --output-junit ctest.xml
          cmake --install _build/default
      - name: Install editable bindings and test the SDK
        run: |
          python -m pip install --no-build-isolation -e python/pyalps \
            --config-setting "build-dir=$PWD/_build/contributor-python"
          python -m pytest tests/pyalps tests/cmake -q --junitxml=_build/default/python.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: contributor-${{ matrix.os }}-reports
          path: |
            _build/default/ctest.xml
            _build/default/python.xml
            _build/default/Testing/Temporary/**
            _build/default/CMakeFiles/CMakeConfigureLog.yaml

  source-status:
    name: Source CI
    if: always()
    needs: [prepare, build, developer-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation and builds
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEVELOPER_RESULT: ${{ needs.developer-setup.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$DEVELOPER_RESULT" = success
