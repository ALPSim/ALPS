name: ALPS source CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  merge_group:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: Source-build coverage
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_PARALLEL_LEVEL: 2

jobs:
  prepare:
    name: Validate CI and select builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Lint workflows and shell helpers
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck .github/scripts/*.sh
      - name: Test CI helpers
        run: |
          python -m pip install pytest
          python -m pytest tests/ci -q --junitxml=ci-tests.xml
      - name: Select source matrix
        id: matrix
        env:
          TIER: ${{ inputs.tier || 'auto' }}
        run: python .github/scripts/ci_matrix.py --tier "$TIER"
      - name: Summarize helper tests
        if: always()
        run: python .github/scripts/junit_summary.py ci-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-helper-tests
          path: ci-tests.xml

  build:
    name: Source / ${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ALPS_BOOST_MPI: ${{ matrix.mpi }}
      BOOST_VERSION: ${{ matrix.boost }}
      BOOST_SHA256: ${{ matrix.boost_sha256 }}
      COMPILER_PACKAGES: ${{ matrix.packages }}
      COMPILER_REPOSITORY: ${{ matrix.repository }}
      EXTRAS: ${{ matrix.extras }}
      EXTENSIVE: ${{ matrix.extensive }}
      SANITIZER: ${{ matrix.sanitizer }}
      CXX_STANDARD: ${{ matrix.standard }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CMake and test tools
        run: python -m pip install 'cmake>=4.3' ninja pytest
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          if [[ "$COMPILER_REPOSITORY" == gcc ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          elif [[ "$COMPILER_REPOSITORY" == llvm ]]; then
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
              https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
            sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
            echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
              | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          fi
          sudo apt-get update
          read -r -a compiler_packages <<< "$COMPILER_PACKAGES"
          sudo apt-get install -y liblapack-dev libblas-dev libopenmpi-dev libhdf5-dev "${compiler_packages[@]}"
          if [[ "$EXTRAS" == true ]]; then sudo apt-get install -y gfortran xsltproc; fi
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        timeout-minutes: 30
        run: brew install open-mpi hdf5
      - name: Build verified Boost sources
        timeout-minutes: 30
        run: |
          archive="$RUNNER_TEMP/boost.tar.gz"
          directory="boost_${BOOST_VERSION//./_}"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            "https://archives.boost.io/release/$BOOST_VERSION/source/$directory.tar.gz" -o "$archive"
          printf '%s  %s\n' "$BOOST_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          bash .github/scripts/build-boost.sh "$RUNNER_TEMP/$directory" "$PWD/_build/boost-install"
      - name: Configure and build SDK
        run: |
          extra_args=()
          if [[ "$EXTRAS" == true ]]; then
            extra_args+=(-DALPS_BUILD_EXAMPLES=ON -DALPS_ENABLE_OPENMP=ON)
          fi
          if [[ "$EXTENSIVE" == true ]]; then extra_args+=(-DALPS_BUILD_EXTENSIVE_TESTS=ON); fi
          if [[ "$SANITIZER" == true ]]; then
            flags='-fsanitize=address,undefined -fno-omit-frame-pointer'
            extra_args+=(-DCMAKE_BUILD_TYPE=Debug
                         '-DCMAKE_C_FLAGS_DEBUG=-O1 -g' '-DCMAKE_CXX_FLAGS_DEBUG=-O1 -g'
                         "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags"
                         "-DCMAKE_EXE_LINKER_FLAGS=$flags" "-DCMAKE_SHARED_LINKER_FLAGS=$flags")
          fi
          cmake -S . -B _build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            "-DALPS_ENABLE_MPI=$ALPS_BOOST_MPI" \
            "-DCMAKE_PREFIX_PATH=$PWD/_build/boost-install" \
            "-DCMAKE_INSTALL_PREFIX=$PWD/_build/ci/install" \
            "-DCMAKE_CXX_STANDARD=$CXX_STANDARD" "${extra_args[@]}"
          cmake --build _build/ci
      - name: Test SDK
        env:
          # Allocation-limit tests deliberately request impossible allocations.
          # Leak checking of uninstrumented system dependencies is separate from
          # the address and undefined-behavior checks in this job.
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir _build/ci --output-on-failure --output-junit ctest.xml --no-tests=error
      - name: Test installed XML tools after relocation
        if: matrix.extras
        env:
          ALPS_XML_BUILD: _build/ci
        run: python -m pytest tests/cli -q --junitxml=_build/ci/cli.xml
      - name: Build installed C, C++ and Fortran tutorials
        if: matrix.extras
        run: |
          cmake --install _build/ci
          cmake --install _build/ci --component tutorials
          tutorials="$PWD/_build/ci/install/share/alps/tutorials"
          for source in "$tutorials/examples" "$tutorials/examples/fortran"; do
            output="_build/consumers/${source#"$tutorials/"}"
            cmake -S "$source" -B "$output" -G Ninja \
              "-DALPS_DIR=$PWD/_build/ci/install/share/alps" \
              "-DCMAKE_PREFIX_PATH=$PWD/_build/boost-install"
            cmake --build "$output"
            ctest --test-dir "$output" --output-on-failure --output-junit ctest.xml --no-tests=error
          done
          find "$tutorials" -mindepth 1 -path "$tutorials/examples" -prune -o -name CMakeLists.txt -print0 | while IFS= read -r -d '' file; do
            source="${file%/CMakeLists.txt}"
            output="_build/consumers/${source#"$tutorials/"}"
            cmake -S "$source" -B "$output" -G Ninja \
              "-DALPS_DIR=$PWD/_build/ci/install/share/alps" \
              "-DCMAKE_PREFIX_PATH=$PWD/_build/boost-install"
            cmake --build "$output"
            ctest --test-dir "$output" --output-on-failure --output-junit ctest.xml
          done
      - name: Summarize test results
        if: always()
        run: python .github/scripts/junit_summary.py '_build/**/ctest.xml' _build/ci/cli.xml
      - name: Retain test and configure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-${{ matrix.id }}-reports
          path: |
            _build/**/ctest.xml
            _build/ci/cli.xml
            _build/**/Testing/Temporary/**
            _build/**/CMakeFiles/CMakeConfigureLog.yaml

  source-status:
    name: Source CI
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation and builds
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$PREPARE_RESULT" = success && test "$BUILD_RESULT" = success
