name: PR cards

# Puts every open PR on the project board in "Generated PRs" under its author,
# keeps its Issue field up to date and, when a reviewer is requested, gives them
# a copy of its card under their own name, keeps the review lights on both
# cards current, and removes the reviewers' cards once the PR is merged or
# closed (.github/scripts/review_cards.py).
#
# pull_request_target so PRs from forks get the token too. The script always
# comes from the default branch; the PR's code is never checked out. Reviews on
# fork PRs get no secrets, so review-cards-forks.yml updates the cards after
# this run finishes; the schedule catches anything that misses.
on:
  pull_request_target:
    types: [opened, edited, reopened, closed, ready_for_review, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty for every PR on the board)
        type: string
        default: ''
      dry_run:
        description: Only print what would change
        type: boolean
        default: false

permissions:
  contents: read

# One queue per PR, so a run for one PR never replaces the pending run of another.
concurrency:
  group: review-cards-${{ github.event.pull_request.number || inputs.pr || 'all' }}

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Review events check out the PR by default; always run master's script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Same token as issue-to-bucket.yml: GITHUB_TOKEN can't write the org project.
      - name: Update the PR's cards
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        # Reviews on fork PRs get no secrets; review-cards-forks.yml picks those
        # up, so skip quietly instead of showing a red check on the contributor's PR.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No BOARD_TOKEN for this event; PR cards after fork reviews will update the cards."
            exit 0
          fi
          python .github/scripts/review_cards.py
