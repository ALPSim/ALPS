name: Build and validate distributions
permissions:
  contents: read
env:
  PIP_ONLY_BINARY: ':all:'
jobs:
  check_version:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install packaging pytest lxml "scikit-build-core>=1.0" "cmake>=3.27" ninja
    - name: Test release validation
      run: python -m pytest tests/packaging -q --junitxml=packaging-tests.xml
    - name: Check package, SDK, and tag versions
      run: python .github/scripts/check_release_version.py
    - name: Summarize packaging helper tests
      if: always()
      run: python .github/scripts/junit_summary.py packaging-tests.xml
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: packaging-helper-tests
        path: packaging-tests.xml
  build_wheels:
    name: Build wheels / ${{ matrix.plat.family }}
    needs:
    - check_version
    - build_sdist
    runs-on: ${{ matrix.plat.os }}
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.plat.family == 'macos' && '2' || '4' }}
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJSON(inputs.full && '[{"os":"ubuntu-24.04","target":"","arch":"x86_64","family":"manylinux"},{"os":"ubuntu-24.04","target":"","arch":"x86_64","family":"musllinux"},{"os":"macos-15","target":"15.0","arch":"arm64","family":"macos"}]'
          || '[{"os":"ubuntu-24.04","target":"","arch":"x86_64","family":"manylinux"}]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Select pinned Linux images
      if: runner.os == 'Linux'
      shell: bash
      run: |
        python -c 'import json, os; m=json.load(open(".github/dependencies.json")); f=open(os.environ["GITHUB_ENV"], "a"); print("CIBW_MANYLINUX_X86_64_IMAGE="+m["manylinux_image"], file=f); print("CIBW_MUSLLINUX_X86_64_IMAGE="+m["musllinux_image"], file=f)'
    - name: Restore wheel Boost build
      id: boost-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: _build/boost-install
        key: wheel-boost-manylinux-${{ hashFiles('.github/dependencies.json', '.github/scripts/build-boost.sh',
          '.github/scripts/prepare_dependencies.py') }}
      if: matrix.plat.family == 'manylinux'
    - name: Restore compiler cache
      id: compiler-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: _build/ccache
        key: wheel-ccache-manylinux-${{ hashFiles('.github/dependencies.json', 'python/pyalps/pyproject.toml') }}-${{
          github.run_id }}-${{ github.run_attempt }}
        restore-keys: wheel-ccache-manylinux-${{ hashFiles('.github/dependencies.json', 'python/pyalps/pyproject.toml')
          }}-
      if: matrix.plat.family == 'manylinux'
    - name: Create wheel report directory
      run: mkdir -p _build/wheel-reports
    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074
      with:
        package-dir: python/pyalps
      env:
        CIBW_ARCHS: ${{ matrix.plat.arch }}
        CIBW_BUILD: ${{ inputs.full && 'cp3{11,12,13,14}' || 'cp3{11,12,14}' }}-${{ matrix.plat.family == 'macos' && 'macosx' || matrix.plat.family }}*
        CIBW_CONTAINER_ENGINE: 'docker; create_args: --volume "${{ github.workspace }}/_build/boost-install:/project/_build/boost-install"
          --volume "${{ github.workspace }}/_build/ccache:/project/_build/ccache" --volume "${{ github.workspace
          }}/_build/wheel-reports:/project/_build/wheel-reports"'
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.plat.target }}
    - name: Save completed Boost build even if wheel tests fail
      if: >-
        always() && !cancelled() && matrix.plat.family == 'manylinux' &&
        steps.boost-cache.outcome == 'success' && steps.boost-cache.outputs.cache-hit != 'true' &&
        hashFiles('_build/boost-install/.alps-boost-sha256') != '' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: _build/boost-install
        key: ${{ steps.boost-cache.outputs.cache-primary-key }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      if: runner.os == 'macOS'
      with:
        name: cibw-sdist
        path: _build/release-sdist
    - name: Rebuild and import the release sdist with the existing SDK
      if: runner.os == 'macOS'
      env:
        ALPS_DIR: ${{ github.workspace }}/_build/distribution/install/share/alps
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.plat.target }}
      run: |
        python -m pip install build 'scikit-build-core>=1.0' 'nanobind==2.15.0' 'cmake>=3.27' ninja
        archives=(_build/release-sdist/*.tar.gz)
        test "${#archives[@]}" -eq 1
        python .github/scripts/run_with_timeout.py 900 \
          python .github/scripts/check_sdist.py "${archives[0]}" \
          --config-setting "cmake.define.HDF5_ROOT=$(brew --prefix hdf5)"
    - name: Show compiler cache statistics
      if: ${{ always() && runner.os == 'macOS' }}
      continue-on-error: true
      run: ccache --show-stats
    - name: Save compiler cache
      if: '!cancelled() && matrix.plat.family == ''manylinux'' && steps.compiler-cache.outcome == ''success'' &&
        (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository)'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: _build/ccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
    - name: Summarize wheel build tests
      if: always()
      run: python .github/scripts/junit_summary.py '_build/wheel-reports/*.xml'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: wheel-tests-${{ matrix.plat.family }}
        path: _build/wheel-reports
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cibw-wheels-${{ matrix.plat.family }}
        path: ./wheelhouse/*.whl
  build_sdist:
    name: Build source distribution
    needs:
    - check_version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Build sdist
      run: pipx run build --sdist --outdir dist python/pyalps
    - name: Smoke check sdist
      run: |
        pipx run twine check dist/*.tar.gz
        tar -tzf dist/*.tar.gz > sdist-manifest.txt
        for path in cpp/maxent_c.cpp cpp/cthyb.cpp cpp/ctint.cpp \
                    cpp/params.cpp cpp/hdf5.cpp cpp/extract_from_pyobject.hpp \
                    LICENSE.txt src/pyalps/__init__.py src/pyalps/__main__.py \
                    _build_support/pyalpsConfig.cmake \
                    cpp/export_simulation.hpp; do
          grep -q "$path" sdist-manifest.txt || { echo "missing $path in sdist"; exit 1; }
        done
        if grep -q '/_vendor/' sdist-manifest.txt; then
          echo "sdist contains vendored C++ SDK sources"
          exit 1
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cibw-sdist
        path: dist/*.tar.gz
  smoke_test:
    name: Installed wheels / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs:
    - check_version
    - build_wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-24.04","macos-15","macos-26"]' || '["ubuntu-24.04"]') }}
        python: ${{ fromJSON(inputs.full && '["3.11","3.12","3.13","3.14"]' || '["3.11","3.12","3.14"]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ${{ startsWith(matrix.os, 'macos-') && 'cibw-wheels-macos' || 'cibw-wheels-manylinux' }}
        path: wheelhouse
        merge-multiple: true
    - name: Install validation requirements
      run: python -m pip install twine 'numpy>=1.26' 'scipy>=1.13' 'matplotlib>=3.8' 'lxml>=5' pytest h5py
    - name: Check wheel metadata
      run: python -m twine check wheelhouse/*.whl
    - name: Install wheel from artifacts
      run: python -m pip install --no-index --find-links wheelhouse pyalps
    - name: Import and run binding surface tests
      run: |
        python .github/scripts/validate_pyalps.py --smoke --output _build/validation --wheelhouse wheelhouse
    - name: Retain installed-wheel validation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pyalps-validation-${{ matrix.os }}-py${{ matrix.python }}
        path: _build/validation
    - name: Summarize wheel tests
      if: always()
      run: python .github/scripts/junit_summary.py _build/validation/pytest.xml
  mpi_smoke:
    name: Smoke test MPI adapter with two ranks
    needs:
    - check_version
    - build_wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: cibw-wheels-manylinux
        path: wheelhouse
        merge-multiple: true
    - name: Install wheel and MPI runtime
      timeout-minutes: 20
      run: |
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
        python -m pip install 'numpy>=1.26' 'scipy>=1.13' 'matplotlib>=3.8' 'lxml>=5' pytest mpi4py
        python -m pip install --no-index --find-links wheelhouse pyalps
    - name: Run two-rank compatibility surface
      run: |
        python .github/scripts/run_with_timeout.py 300 \
          mpiexec -n 2 python .github/scripts/run_mpi_pytest.py \
          --ranks 2 --output _build/mpi \
          tests/pyalps/test_binding_surface.py::test_mpi4py_compatibility_surface \
          tests/pyalps/test_mpi_requests.py
    - name: Summarize per-rank MPI tests
      if: always()
      run: python .github/scripts/junit_summary.py '_build/mpi/*.xml'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mpi-python-reports
        path: _build/mpi
'on':
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
