name: ALPS Python Packaging CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  merge_group:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_ONLY_BINARY: ':all:'

concurrency:
  group: packaging-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_version:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packaging: ${{ steps.policy.outputs.packaging }}
      wheel_matrix: ${{ steps.policy.outputs.wheel_matrix }}
      smoke_matrix: ${{ steps.policy.outputs.smoke_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install packaging pytest "scikit-build-core>=1.0" "cmake>=3.27" ninja
      - name: Test release validation
        run: python -m pytest tests/packaging -q
      - name: Select packaging coverage
        id: policy
        run: python .github/scripts/ci_policy.py
      - name: Check package, SDK, and tag versions
        run: python .github/scripts/check_release_version.py

  build_wheels:
    if: needs.check_version.outputs.packaging != 'none'
    name: Build wheels / ${{ matrix.plat.family }}
    needs: [check_version, build_sdist]
    runs-on: ${{ matrix.plat.os }}
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.plat.family == 'macos' && '2' || '4' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check_version.outputs.wheel_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Select pinned Linux images
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -c 'import json, os; m=json.load(open(".github/dependencies.json")); f=open(os.environ["GITHUB_ENV"], "a"); print("CIBW_MANYLINUX_X86_64_IMAGE="+m["manylinux_image"], file=f); print("CIBW_MUSLLINUX_X86_64_IMAGE="+m["musllinux_image"], file=f)'
      - name: Restore wheel Boost build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/boost-install
          key: wheel-boost-${{ matrix.plat.family }}-${{ hashFiles('.github/ci-matrix.json', '.github/scripts/build-boost.sh', '.github/scripts/prepare_dependencies.py') }}

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/ccache
          key: pyalps-ccache-${{ matrix.plat.family }}-${{ matrix.plat.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pyalps-ccache-${{ matrix.plat.family }}-${{ matrix.plat.arch }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          package-dir: python/pyalps
        env:
          # The wheel build is configured in [tool.cibuildwheel] in
          # python/pyalps/pyproject.toml and the distribution preset in
          # CMakePresets.json; only matrix-derived values live here.
          CIBW_ARCHS: ${{ matrix.plat.arch }}
          CIBW_BUILD: ${{ matrix.plat.build }}
          # cibuildwheel copies /project; mount the compiler cache explicitly
          # so Linux builds update the directory that Actions saves afterward.
          CIBW_CONTAINER_ENGINE: 'docker; create_args: --volume "${{ github.workspace }}/_build/boost-install:/project/_build/boost-install" --volume "${{ github.workspace }}/_build/ccache:/project/_build/ccache" --volume "${{ github.workspace }}/_build/metrics:/project/_build/metrics"'
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.plat.target }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: runner.os == 'macOS'
        with:
          name: cibw-sdist
          path: _build/release-sdist

      - name: Rebuild and import the release sdist with the existing SDK
        if: runner.os == 'macOS'
        env:
          ALPS_DIR: ${{ github.workspace }}/_build/distribution/install/share/alps
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/_build/boost-install
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.plat.target }}
        run: |
          python -m pip install build 'scikit-build-core>=1.0' 'nanobind==2.15.0' 'cmake>=3.27' ninja
          archives=(_build/release-sdist/*.tar.gz)
          test "${#archives[@]}" -eq 1
          python .github/scripts/build_metrics.py run --timeout 900 'Release sdist rebuild' \
            python .github/scripts/check_sdist.py "${archives[0]}" \
            --config-setting "cmake.define.HDF5_ROOT=$(brew --prefix hdf5)"

      - name: Check whether compiler cache changed
        id: cache-policy
        if: always()
        run: python .github/scripts/build_metrics.py cache-policy
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' && steps.cache-policy.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Summarize build performance
        if: always()
        env:
          CCACHE_RESTORED_KEY: ${{ steps.compiler-cache.outputs.cache-matched-key }}
        run: python .github/scripts/build_metrics.py summary
      - name: Retain build performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-performance-${{ matrix.plat.family }}
          path: _build/metrics/**

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-wheels-${{ matrix.plat.family }}
          path: ./wheelhouse/*.whl


  build_sdist:
    if: needs.check_version.outputs.packaging != 'none'
    name: Build source distribution
    needs: [check_version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist --outdir dist python/pyalps

      # The sdist must remain buildable outside the repository checkout:
      # verify its metadata and Python-owned sources. Solver implementations
      # belong to the installed C++ SDK and must not be vendored here.
      - name: Smoke check sdist
        run: |
          pipx run twine check dist/*.tar.gz
          tar -tzf dist/*.tar.gz > sdist-manifest.txt
          for path in cpp/maxent_c.cpp cpp/cthyb.cpp cpp/ctint.cpp \
                      cpp/params.cpp cpp/hdf5.cpp cpp/extract_from_pyobject.hpp \
                      LICENSE.txt src/pyalps/__init__.py src/pyalps/__main__.py \
                      _build_support/pyalpsConfig.cmake \
                      cpp/export_simulation.hpp; do
            grep -q "$path" sdist-manifest.txt || { echo "missing $path in sdist"; exit 1; }
          done
          if grep -q '/_vendor/' sdist-manifest.txt; then
            echo "sdist contains vendored C++ SDK sources"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz


  # cibuildwheel already runs tests/pyalps against every wheel inside the build
  # environment; this job checks the artifacts as they would reach PyPI: the
  # repaired, uploaded-and-downloaded wheel installed with pip on a clean
  # runner, using the wheel built for each supported Python version.
  smoke_test:
    if: ${{ !cancelled() && needs.build_wheels.result == 'success' }}
    name: Smoke test wheels on ${{ matrix.plat.os }} / py${{ matrix.python }}
    needs: [check_version, build_wheels]
    runs-on: ${{ matrix.plat.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check_version.outputs.smoke_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.plat.architecture }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ matrix.plat.artifact }}
          path: wheelhouse
          merge-multiple: true

      - name: Install validation requirements
        # Install every runtime dependency before the offline artifact install.
        run: python -m pip install twine 'numpy>=1.26' 'scipy>=1.13' 'matplotlib>=3.8' pytest h5py

      - name: Check wheel metadata
        run: python -m twine check wheelhouse/*.whl

      - name: Install wheel from artifacts
        run: python -m pip install --no-index --find-links wheelhouse pyalps

      - name: Import and run binding surface tests
        run: |
          python .github/scripts/validate_pyalps.py --output _build/validation --wheelhouse wheelhouse

      - name: Retain installed-wheel validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyalps-validation-${{ matrix.plat.os }}-py${{ matrix.python }}
          path: _build/validation

      - name: Summarize wheel tests
        if: always()
        run: python .github/scripts/junit_summary.py _build/validation/pytest.xml

  # The ordinary wheel tests deliberately keep mpi4py optional. This job
  # installs one consistent Open MPI stack and verifies real inter-rank
  # collectives, requests and point-to-point traffic through pyalps.mpi.
  mpi_smoke:
    if: needs.check_version.outputs.packaging == 'full'
    name: Smoke test MPI adapter with two ranks
    needs: [check_version, build_wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cibw-wheels-manylinux
          path: wheelhouse
          merge-multiple: true

      - name: Install wheel and MPI runtime
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
          python -m pip install 'numpy>=1.26' 'scipy>=1.13' 'matplotlib>=3.8' pytest mpi4py
          python -m pip install --no-index --find-links wheelhouse pyalps

      - name: Run two-rank compatibility surface
        run: mpiexec -n 2 python -m pytest -q tests/pyalps/test_binding_surface.py::test_mpi4py_compatibility_surface tests/pyalps/test_mpi_requests.py

  packaging-status:
    name: Packaging CI
    if: always()
    needs: [check_version, build_wheels, build_sdist, smoke_test, mpi_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected packaging check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['check_version']['result'] == 'success', jobs
          tier = jobs['check_version']['outputs']['packaging']
          for name, job in jobs.items():
              if name == 'check_version':
                  continue
              required = tier == 'full' or (tier == 'quick' and name != 'mpi_smoke')
              assert job['result'] == ('success' if required else 'skipped'), (name, job)
          PY

  release-source:
    name: Release source validation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build.yml
    with:
      tier: full

  upload_pypi:
    needs: [packaging-status, release-source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Check every distribution before publishing
        run: python .github/scripts/check_release_version.py --dist dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
