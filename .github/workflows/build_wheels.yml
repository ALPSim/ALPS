name: ALPS Python Packaging CI/CD

on:
  push:
    branches:
      - master    # the default branch
    tags:
      - 'v*'    # this triggers the workflow when a tag starting with 'v' is pushed
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to add CPython 3.14 wheels to'
        required: true
        type: string

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

jobs:
  check_version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        id: source
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && env.RELEASE_REF || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install packaging pytest
      - name: Test release validation
        run: python -m pytest test/packaging -q
      - name: Check package, SDK, and tag versions
        run: python script/check_release_version.py --ref "$RELEASE_REF"

  build_wheels:
    name: Build wheels on ${{ matrix.plat.os }}
    needs: [check_version]
    runs-on: ${{ matrix.plat.os }}
    strategy:
      matrix:
        plat:
        - { os: ubuntu-latest, target: "", arch: x86_64, homebrew: ''}
        - { os: macos-15, target: "15.0" , arch: arm64, homebrew: '/opt/homebrew'}
        - { os: macos-26, target: "26.0" , arch: arm64, homebrew: '/opt/homebrew'}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check_version.outputs.source_sha }}

      # Install Fortran compiler based on OS
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          if [ "${{ matrix.plat.os }}" = "ubuntu-latest" ]; then
            printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
              | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
            sudo apt-get update
            sudo apt-get install -y gfortran
          else
            brew update
            brew install gfortran
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ github.event_name == 'workflow_dispatch' && 'cp314-*' || 'cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*' }}
          CIBW_ARCHS: ${{ matrix.plat.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.plat.arch }}

          # Set Fortran compiler for all platforms
          CIBW_ENVIRONMENT: "FC=gfortran"

          # macOS-specific settings
          CIBW_ENVIRONMENT_MACOS: >
            Boost_ROOT_DIR=/Users/runner/work/ALPS/ALPS/boost_1_87_0
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.plat.target }}
            CXXFLAGS="-stdlib=libc++"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.plat.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl


  build_sdist:
    name: Build source distribution
    needs: [check_version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check_version.outputs.source_sha }}

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz


  upload_pypi:
    needs: [check_version, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check_version.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v8
        with:
          # Backfills upload only the new wheels; the published sdist stays intact.
          pattern: ${{ github.event_name == 'workflow_dispatch' && 'cibw-wheels-*' || 'cibw-*' }}
          path: dist
          merge-multiple: true

      - name: Check every distribution before publishing
        run: python script/check_release_version.py --ref "$RELEASE_REF" --dist dist

      - uses: pypa/gh-action-pypi-publish@release/v1
