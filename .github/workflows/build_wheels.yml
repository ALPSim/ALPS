# Keep this filename for the existing PyPI trusted publisher. Coordinate any
# rename with the maintainers who control its publisher configuration.
name: Release
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/compatibility.yml
  publish:
    needs:
    - validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - run: python -m pip install packaging
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true
    - name: Check every distribution before publishing
      run: python .github/scripts/check_release_version.py --dist dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
