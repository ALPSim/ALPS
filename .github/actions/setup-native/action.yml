name: Install native build prerequisites
description: Use binary Linux/macOS dependencies and prebuilt Python build tools.
inputs:
  python:
    description: Python interpreter
    default: '3.12'
  cmake:
    description: CMake package requirement
    default: cmake>=3.27
runs:
  using: composite
  steps:
  - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
    with:
      python-version: ${{ inputs.python }}
      cache: pip
      cache-dependency-path: .github/actions/setup-native/action.yml
  - name: Install Linux libraries
    run: |
      sudo apt-get update
      sudo apt-get install -y libboost-all-dev libgtest-dev libhdf5-dev libblas-dev liblapack-dev libsqlite3-dev
    shell: bash
    if: runner.os == 'Linux'
  - name: Install macOS libraries
    run: |
      brew install --force-bottle boost googletest hdf5 openblas
      echo "CMAKE_PREFIX_PATH=$(brew --prefix boost):$(brew --prefix hdf5):$(brew --prefix openblas)" >> "$GITHUB_ENV"
    shell: bash
    if: runner.os == 'macOS'
  - name: Install build tools
    run: |
      python -m pip install "$CMAKE_REQUIREMENT" ninja pytest numpy h5py -r .github/scripts/citations/requirements.txt
    shell: bash
    env:
      CMAKE_REQUIREMENT: ${{ inputs.cmake }}
